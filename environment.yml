name: comorb-network
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas>=1.5
  - numpy>=1.23
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12
  - networkx>=3.0
  - scikit-learn>=1.3
  - jupyter
  - ipykernel
  - nbformat>=5.1
  - igraph>=0.10        # required by leidenalg
  - pip:
    - gensim>=4.3.0
    - node2vec>=0.4.6
    - leidenalg>=0.10.0
    - python-louvain>=0.16
